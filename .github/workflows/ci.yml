name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: assettrack
          POSTGRES_PASSWORD: assettrack
          POSTGRES_DB: assettrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://assettrack:assettrack@localhost:5432/assettrack
      DIRECT_URL: postgresql://assettrack:assettrack@localhost:5432/assettrack
      AUTH_SECRET: ci-auth-secret-at-least-32-characters-long
      AUTH_URL: http://localhost:3000
      SEED_ADMIN_EMAIL: admin@example.com
      SEED_ADMIN_PASSWORD: ChangeMeNow1!
      SKIP_ENV_VALIDATION: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Migrate
        run: npx prisma migrate deploy

      - name: Seed
        run: npm run db:seed

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
